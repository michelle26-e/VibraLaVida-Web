name: Deploy Vibra la Vida to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false


# ==========================================================
# BUILD
# ==========================================================

jobs:

  build:
    name: Compilar Vibra la Vida
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4


      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Instalar dependencias
        run: npm ci


      - name: Compilar proyecto
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CALCULADORAS_API_URL: ${{ secrets.VITE_CALCULADORAS_API_URL }}


      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5


      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist


  # ========================================================
  # DEPLOY
  # ========================================================

  deploy:
    name: Publicar Vibra la Vida

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4